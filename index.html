<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swastik accessories</title>
<meta name="description" content="Wholesale only. Minimum wholesale order accepted.">
<style>
  :root{
    --bg:#faf6f3;
    --navy:#2a3355;
    --red:#a3262a;
    --card:#ffffff;
    --border:#e6e0dc;
    --wa:#25d366;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--navy);
    padding-top:68px;
    min-height:100vh;
  }

  /* ---------- Header ---------- */
  header{
    position:fixed;top:0;left:0;right:0;z-index:50;
    height:68px;background:#fff;
    display:flex;align-items:center;gap:14px;
    padding:0 18px;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
  }
  .icon-btn{background:none;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;width:36px;height:36px}
  .icon-btn svg{width:28px;height:28px;stroke:var(--red);fill:none;stroke-width:2.6;stroke-linecap:round}
  .brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-decoration:none}
  .brand img{height:30px;width:auto;display:none}
  .brand .title{font-size:21px;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- Search bar ---------- */
  .searchbar{
    position:fixed;top:68px;left:0;right:0;z-index:49;
    background:#fff;padding:10px 18px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    transform:translateY(-130%);transition:transform .25s ease;
  }
  .searchbar.open{transform:translateY(0)}
  .searchbar input{
    width:100%;padding:12px 16px;font-size:16px;
    border:1px solid var(--border);border-radius:10px;outline:none;color:var(--navy);background:var(--bg)
  }

  /* ---------- Side menu ---------- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
  .overlay.open{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;top:0;left:0;bottom:0;width:78%;max-width:300px;background:#fff;z-index:61;
    transform:translateX(-100%);transition:transform .25s ease;padding:24px 20px;
  }
  .drawer.open{transform:translateX(0)}
  .drawer h3{font-size:20px;margin-bottom:20px;color:var(--navy)}
  .drawer a{display:block;padding:14px 0;color:var(--navy);text-decoration:none;font-size:18px;border-bottom:1px solid var(--border)}

  /* ---------- Content ---------- */
  main{padding:34px 20px 120px}
  h1{font-size:34px;line-height:1.2;font-weight:700;color:var(--navy)}
  .notice{
    margin-top:150px;
    font-size:28px;line-height:1.5;font-weight:400;color:var(--navy);
  }
  h2{margin-top:44px;font-size:34px;font-weight:700;color:var(--navy)}

  .grid{
    margin-top:36px;
    display:grid;grid-template-columns:1fr 1fr;gap:40px 40px;
  }
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.08);
    text-decoration:none;color:var(--navy);display:flex;flex-direction:column;
  }
  .card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#eee}
  .card .label{padding:16px 14px 18px;text-align:center;font-size:24px;line-height:1.4;font-weight:500}

  /* ---------- WhatsApp chat button ---------- */
  .chat{
    position:fixed;right:20px;bottom:24px;z-index:40;
    display:flex;align-items:center;gap:10px;
    background:#fff;border-radius:40px;padding:10px 20px 10px 14px;
    text-decoration:none;color:#111;font-weight:700;font-size:28px;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  .chat .wa{width:44px;height:44px;border-radius:50%;background:var(--wa);display:flex;align-items:center;justify-content:center}
  .chat .wa svg{width:28px;height:28px;fill:#fff}

  /* ---------- Small screens ---------- */
  @media (max-width:480px){
    .notice{margin-top:120px;font-size:22px}
    h1{font-size:28px}
    h2{font-size:28px}
    .grid{gap:28px 22px}
    .card .label{font-size:19px;padding:14px 10px 16px}
    .chat{font-size:22px;padding:8px 16px 8px 10px}
    .chat .wa{width:38px;height:38px}
  }
  @media (min-width:900px){
    main{max-width:960px;margin:0 auto}
    .grid{grid-template-columns:repeat(3,1fr)}
  }
</style>
</head>
<body>

<header>
  <button class="icon-btn" id="menuBtn" aria-label="Menu">
    <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <a class="brand" href="index.html">
    <img id="logo" alt="logo">
    <span class="title" id="brandName">Swastik accessories</span>
  </a>
  <button class="icon-btn" id="searchBtn" aria-label="Search">
    <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
  </button>
</header>

<div class="searchbar" id="searchbar">
  <input type="search" id="searchInput" placeholder="Search categories...">
</div>

<div class="overlay" id="overlay"></div>
<nav class="drawer" id="drawer">
  <h3 id="drawerTitle">Swastik accessories</h3>
  <a href="index.html">Home</a>
  <a href="#" id="drawerWa">Contact on WhatsApp</a>
</nav>

<main>
  <h1>Read before place your order</h1>

  <p class="notice">
    Minimum wholesale order ₹3100/- accepted<br>
    Shiping and packing charge always extra according size of the parcel
  </p>

  <h2>Wholesale only !!!</h2>

  <!-- Category cards yahan automatically aayenge (neeche CATEGORIES array se) -->
  <div class="grid" id="grid"></div>
</main>

<a class="chat" id="chatBtn" href="#" target="_blank" rel="noopener">
  <span class="wa">
    <svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 004.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0012.04 2zm5.8 14.2c-.25.69-1.45 1.32-2 1.4-.5.07-1.13.1-1.82-.11-.42-.13-.96-.31-1.65-.61-2.9-1.25-4.8-4.17-4.94-4.37-.14-.19-1.18-1.57-1.18-3 0-1.43.75-2.13 1.01-2.42.27-.29.58-.36.78-.36l.56.01c.18.01.42-.07.66.5.25.6.85 2.07.92 2.22.08.15.13.32.03.51-.1.2-.15.32-.3.49-.15.17-.31.38-.44.51-.15.15-.3.31-.13.6.17.29.76 1.25 1.63 2.02 1.12 1 2.06 1.31 2.35 1.46.29.15.46.12.63-.07.17-.2.73-.85.92-1.14.2-.29.39-.24.66-.14.27.1 1.7.8 1.99.95.29.15.49.22.56.34.07.12.07.7-.18 1.39z"/></svg>
  </span>
  CHAT
</a>

<script>
/* =====================================================
   CONFIG — sirf yahan apni details badlo
   ===================================================== */
const CONFIG = {
  brandName: "Swastik accessories",   // header me dikhne wala naam
  logo: "",                           // logo image ka path/URL (khali = sirf naam dikhega)
  whatsapp: "919999999999"            // country code ke saath number, bina + ke
};

/* =====================================================
   CATEGORIES — abhi khali hai (products hata diye gaye).
   Add karne ke liye aise likho:
   { name: "Viral Toys and gifting products", image: "images/toys.jpg", link: "category-toys.html" }
   ===================================================== */
const CATEGORIES = [
  // { name: "Category name", image: "images/photo.jpg", link: "#" },
];

/* ---------- Setup ---------- */
document.title = CONFIG.brandName;
document.getElementById("brandName").textContent = CONFIG.brandName;
document.getElementById("drawerTitle").textContent = CONFIG.brandName;
if (CONFIG.logo) {
  const l = document.getElementById("logo");
  l.src = CONFIG.logo; l.style.display = "block";
}
const waUrl = "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent("Hello, I want to place a wholesale order.");
document.getElementById("chatBtn").href = waUrl;
document.getElementById("drawerWa").href = waUrl;

/* ---------- Render categories ---------- */
const grid = document.getElementById("grid");
function render(list){
  grid.innerHTML = "";
  list.forEach(c => {
    const a = document.createElement("a");
    a.className = "card";
    a.href = c.link || "#";
    a.innerHTML = '<img loading="lazy" src="' + c.image + '" alt=""><div class="label"></div>';
    a.querySelector(".label").textContent = c.name;
    a.querySelector("img").alt = c.name;
    grid.appendChild(a);
  });
}
render(CATEGORIES);

/* ---------- Menu ---------- */
const drawer = document.getElementById("drawer");
const overlay = document.getElementById("overlay");
function toggleMenu(open){
  drawer.classList.toggle("open", open);
  overlay.classList.toggle("open", open);
}
document.getElementById("menuBtn").onclick = () => toggleMenu(true);
overlay.onclick = () => toggleMenu(false);

/* ---------- Search ---------- */
const searchbar = document.getElementById("searchbar");
const searchInput = document.getElementById("searchInput");
document.getElementById("searchBtn").onclick = () => {
  searchbar.classList.toggle("open");
  if (searchbar.classList.contains("open")) searchInput.focus();
};
searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim().toLowerCase();
  render(CATEGORIES.filter(c => c.name.toLowerCase().includes(q)));
});
</script>
</body>
</html>
